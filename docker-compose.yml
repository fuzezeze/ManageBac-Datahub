services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_dev
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: ["uvicorn", "hub.web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["python", "-m", "hub", "worker"]
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build: .
    command: ["python", "-m", "hub", "scheduler"]
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
